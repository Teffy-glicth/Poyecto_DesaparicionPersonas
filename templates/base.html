<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto Desaparición de Personas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{{ url_for('index') }}">Proyecto Desaparición de Personas</a>
    </header>

    <main class="site-main">
        {% if current_slug %}
        <a class="back-to-menu" href="{{ url_for('index') }}">
            <span class="back-arrow">←</span><span>Regresar al menú principal</span>
        </a>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Minería de Datos · Proyecto Desaparición de Personas</p>
    </footer>
</body>
</html>
